<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div id="image">
        Hover over an image below to display here.
    </div>

<div>
    <img src="https://picsum.photos/id/1015/400/300" alt="Beautiful mountain landscape" onmouseover="upDate(this)"
        onmouseleave="undo()" width="150">

    <img src="https://picsum.photos/id/1018/400/300" alt="Mountain and lake view" onmouseover="upDate(this)"
        onmouseleave="undo()" width="150">

    <img src="https://picsum.photos/id/1020/400/300" alt="Beautiful forest landscape" onmouseover="upDate(this)"
        onmouseleave="undo()" width="150">
</div>


</body>

</html>
